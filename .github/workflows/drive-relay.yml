name: drive-relay

# Temporary relay: this sandbox can reach github.com only, while the card images live
# on a public Google Drive folder. A GitHub runner can reach both, so it downloads the
# folder here and uploads it as a build artifact, which `gh run download` brings back
# into the workspace. Nothing is committed; the artifact is deleted after the transfer.
on:
  push:
    paths:
      - ".github/relay/trigger"
  workflow_dispatch:
    inputs:
      folder:
        description: Public Google Drive folder with the card images
        required: false
        default: "https://drive.google.com/drive/folders/1gdNQDdVemuUyA3SbGf8KivNwkPTgyOJk"
      labels:
        description: Public Google Drive file with the label CSV
        required: false
        default: "17Xxt2-2f2UO_BiISBJwJTNVarxkIO6GP"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOLDER: ${{ github.event.inputs.folder || 'https://drive.google.com/drive/folders/1gdNQDdVemuUyA3SbGf8KivNwkPTgyOJk' }}
      LABELS: ${{ github.event.inputs.labels || '17Xxt2-2f2UO_BiISBJwJTNVarxkIO6GP' }}
    steps:
      - name: Install gdown
        run: python -m pip install --quiet gdown

      - name: Download the folder
        run: |
          mkdir -p payload
          gdown --folder "$FOLDER" -O payload --remaining-ok || true
          find payload -type f | head -5
          echo "files: $(find payload -type f | wc -l)"

      - name: Download the label CSV
        run: |
          gdown "$LABELS" -O payload/labels.csv || gdown --fuzzy "$LABELS" -O payload/labels.csv
          head -3 payload/labels.csv

      - name: Report the size
        run: du -sh payload && find payload -type f | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: drive-cards
          path: payload
          retention-days: 1
