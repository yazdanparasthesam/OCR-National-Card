name: drive-relay

# Temporary relay: this sandbox can reach github.com only, while the card images live
# on a public Google Drive folder. A GitHub runner can reach both, so it downloads the
# folder here, packs it into one zip and pushes that to a throwaway branch
# (`relay/dataset`). The sandbox then fetches the branch with plain git — no Drive
# access needed — and the branch is deleted straight after the transfer.
#
# Artifacts were the first attempt, but `gh run download` redirects to a blob host that
# this sandbox cannot reach either; a git branch does not leave github.com.
on:
  push:
    paths:
      - ".github/relay/trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOLDER: "https://drive.google.com/drive/folders/1gdNQDdVemuUyA3SbGf8KivNwkPTgyOJk"
      LABELS: "17Xxt2-2f2UO_BiISBJwJTNVarxkIO6GP"
    steps:
      - uses: actions/checkout@v4

      - name: Install gdown
        run: python -m pip install --quiet gdown

      - name: Download the folder and the label CSV
        run: |
          set -x
          mkdir -p payload
          gdown --folder "$FOLDER" -O payload --remaining-ok || true
          gdown "$LABELS" -O payload/labels.csv || true
          find payload -type f | wc -l
          du -sh payload

      - name: Pack
        run: |
          if [ ! -s payload/labels.csv ]; then echo "labels.csv missing" >&2; exit 1; fi
          python - <<'PY'
          import os, zipfile
          with zipfile.ZipFile("dataset.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for root, _dirs, files in os.walk("payload"):
                  for name in sorted(files):
                      path = os.path.join(root, name)
                      z.write(path, os.path.relpath(path, "payload"))
          print("zip written", os.path.getsize("dataset.zip"))
          PY
          du -h dataset.zip

      - name: Push the branch
        run: |
          git config user.name "drive-relay"
          git config user.email "drive-relay@users.noreply.github.com"
          git checkout -B relay/dataset
          git add -f dataset.zip
          git commit -m "relay: card images + labels"
          git push -f origin relay/dataset
