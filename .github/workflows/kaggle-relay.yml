name: kaggle-relay

on:
  push:
    paths:
      - .github/relay/trigger
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the dataset
        run: |
          python -m pip install --quiet --disable-pip-version-check kagglehub
          python - <<'PY'
          import pathlib, shutil, sys
          import kagglehub
          slug = "kibordevents/iranian-national-id-card-dataset"
          try:
              root = kagglehub.dataset_download(slug)
          except Exception as exc:  # noqa: BLE001 - reported in the payload
              print("download failed:", type(exc).__name__, exc)
              sys.exit(1)
          print("kagglehub path:", root)
          src = pathlib.Path(root)
          dst = pathlib.Path("payload")
          dst.mkdir(exist_ok=True)
          for path in src.rglob("*"):
              if path.is_file():
                  target = dst / path.relative_to(src)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, target)
          print("copied", sum(1 for _ in dst.rglob('*') if _.is_file()), "files")
          PY

      - name: Describe what arrived
        run: |
          {
            echo "== payload =="
            du -sh payload || true
            echo "== files: $(find payload -type f | wc -l)"
            echo "== tree =="
            find payload -maxdepth 3 | head -60
            echo "== extensions =="
            find payload -type f | sed 's/.*\.//' | sort | uniq -c | sort -rn | head -20
            echo "== csv/json heads =="
            for f in $(find payload -type f \( -name '*.csv' -o -name '*.json' -o -name '*.txt' \) | head -4); do
              echo "--- $f"; head -5 "$f"; echo
            done
            echo "== image sample =="
            find payload -type f \( -name '*.jpg' -o -name '*.png' -o -name '*.jpeg' \) | head -10
          } > download.log 2>&1
          cat download.log

      - name: Pack
        run: |
          cd payload
          zip -q -r ../dataset.zip . || true
          cd ..
          ls -l dataset.zip
          size=$(stat -c%s dataset.zip)
          if [ "$size" -gt 45000000 ]; then
            # GitHub rejects a blob over 100 MB, and a failed push leaves no log behind,
            # so the monolith is cut into 45 MB pieces and then thrown away
            split -b 45m -d dataset.zip part.zip.
            rm -f dataset.zip
            ls -l part.zip.*
          fi
          echo "files to push:"; ls -l

      - name: Push the payload to a throwaway branch
        continue-on-error: true
        run: |
          set -x
          git config user.name "relay"
          git config user.email "relay@users.noreply.github.com"
          git checkout --orphan relay-kaggle-payload
          git rm -rq --cached . >/dev/null 2>&1 || true
          {
            git add -f download.log
            for f in dataset.zip part.zip.*; do
              if [ -e "$f" ]; then git add -f "$f"; fi
            done
            git status --short | head -25
            git commit -qm "kaggle payload"
            git push -f origin HEAD:refs/heads/relay/kaggle
          } > push.log 2>&1
          cat push.log

      - name: Report the log as an issue when the push failed
        if: always()
        run: |
          [ -f push.log ] || echo "no push.log (the push step never ran)" > push.log
          if ! git ls-remote --exit-code --heads origin relay/kaggle >/dev/null 2>&1; then
            gh issue create --title "kaggle relay log" --body-file <(cat download.log push.log) || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
