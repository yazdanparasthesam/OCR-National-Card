[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nidocr"
version = "1.0.0"
description = "Iranian National Card (کارت ملی هوشمند) OCR — OpenCV field detection, Persian text extraction, FastAPI service and Streamlit UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OCR-National-Card contributors" }]
keywords = ["ocr", "persian", "farsi", "iranian-national-card", "opencv", "tesseract", "fastapi", "streamlit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Natural Language :: Persian",
]

dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pillow>=10.0",
  "pytesseract>=0.3.10",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "streamlit>=1.35",
  "httpx>=0.26",
]

[project.optional-dependencies]
synthetic = ["arabic-reshaper>=3.0", "python-bidi>=0.4"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "arabic-reshaper>=3.0",
  "python-bidi>=0.4",
]

[project.scripts]
nidocr = "nidocr.cli:main"

[tool.setuptools.packages.find]
include = ["nidocr*"]

[tool.setuptools.package-data]
nidocr = ["templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
